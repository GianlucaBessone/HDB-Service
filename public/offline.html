<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión - HDB Service</title>
    <style>
        body {
            font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #F5F7F9;
            color: #182130;
            text-align: center;
            padding: 20px;
        }
        h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        p { color: #5C6676; font-size: 14px; max-width: 400px; line-height: 1.5; }
        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #0F6A7B;
            color: white;
            text-decoration: none;
            border-radius: 6px; font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <h1>Sin conexión</h1>
    <p>No hay conexión a internet. Algunas funciones de HDB Service no estarán disponibles hasta recuperar la señal.</p>
    <a href="/" class="btn">Reintentar</a>
</body>
</html>
